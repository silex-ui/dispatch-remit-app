<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dispatch &amp; Remit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{
  --bg:#EDF0F4;--surface:#FFFFFF;--ink:#141C26;--muted:#586577;--line:#D3DAE3;--fld:#F6F8FB;
  --red:#D0273A;--green:#178A50;--purple:#6A48D6;--orange:#D9600A;--blue:#1E63D8;--yellow:#F5B800;--on:#FFFFFF;--yink:#3A2C00;
  --head:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;--body:'Figtree','Segoe UI',system-ui,-apple-system,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0E1319;--surface:#18202A;--ink:#EEF2F6;--muted:#9AA7B7;--line:#2C3745;--fld:#111820;
  --red:#EF5568;--green:#2FBF74;--purple:#9A85F2;--orange:#F58A3D;--blue:#5B98F5;--yellow:#F5C518;--on:#0B1016;--yink:#F5E6A8}
}
:root[data-theme="dark"]{--bg:#0E1319;--surface:#18202A;--ink:#EEF2F6;--muted:#9AA7B7;--line:#2C3745;--fld:#111820;
  --red:#EF5568;--green:#2FBF74;--purple:#9A85F2;--orange:#F58A3D;--blue:#5B98F5;--yellow:#F5C518;--on:#0B1016;--yink:#F5E6A8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);-webkit-text-size-adjust:100%;overflow-x:hidden}
#app{max-width:720px;margin:0 auto;padding:0 14px 90px}
h1,h2,h3,h4{font-family:var(--head);margin:0;line-height:1.15}
h2{font-size:1.35rem;font-weight:800}
h3{font-size:1.05rem;font-weight:800}
h4{font-size:.95rem;font-weight:600;margin-bottom:8px}
button{font:inherit;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--fld);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-height:44px}
textarea{resize:vertical}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.top strong{font-family:var(--head);font-size:1.05rem;font-weight:800;display:block}
.role{font-size:.8rem;color:var(--muted)}
.sb{font-size:.72rem;font-weight:700;border-radius:999px;padding:4px 10px;display:inline-flex;align-items:center;white-space:nowrap}
.sb-ok{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green)}
.sb-wait{background:color-mix(in srgb,var(--muted) 18%,transparent);color:var(--muted)}
.sb-bad{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red)}
.hb{display:flex;gap:6px;align-items:center}
.sb-refresh{padding:4px 9px;min-height:0;font-size:1rem;line-height:1}

/* buttons */
.btn{border:0;border-radius:12px;padding:0 16px;min-height:44px;font-weight:700;background:var(--ink);color:var(--surface);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn{white-space:nowrap}
.btn[disabled]{opacity:.55;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.red{background:var(--red);color:var(--on)}.btn.green{background:var(--green);color:var(--on)}
.btn.sm{min-height:30px;padding:0 10px;font-size:.78rem;border-radius:9px}
.flaglist{list-style:none;margin:4px 0 0;padding:0;display:grid;gap:6px}
.flaglist li{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding:6px 0;font-size:.9rem}
.flagbtns{display:flex;gap:6px;flex:none}
.seg{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:10px}
.segbtn{flex:1;border:0;background:transparent;color:var(--ink);padding:10px 0;font-weight:700;font-size:.9rem}
.segbtn.on{background:var(--ink);color:var(--surface)}
.flagbanner ul.flaglist li{border-bottom:1px dashed rgba(0,0,0,.08)}
.btn.purple{background:var(--purple);color:var(--on)}.btn.orange{background:var(--orange);color:var(--on)}
.btn.blue{background:var(--blue);color:var(--on)}.btn.yellow{background:var(--yellow);color:var(--yink)}
.btn.full{width:100%}
.btn.big{min-height:60px;font-size:1.15rem;font-weight:800;width:100%;border-radius:14px}
.ib{width:42px;height:42px;border-radius:11px;border:0;display:grid;place-items:center;background:var(--ink);color:var(--surface)}
.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib.red{background:var(--red);color:var(--on)}.ib.green{background:var(--green);color:var(--on)}
.ib.purple{background:var(--purple);color:var(--on)}.ib.orange{background:var(--orange);color:var(--on)}
.ib.sm{width:28px;height:28px;border-radius:8px}.ib.sm svg{width:15px;height:15px}

/* login */
.login{padding-top:12vh;max-width:380px;margin:0 auto;display:grid;gap:14px}
.login h1{font-size:2.2rem;font-weight:800}
.sub{margin:-6px 0 4px;color:var(--muted)}
.f{display:grid;gap:6px;font-weight:600;font-size:.92rem}
.f>input,.f>select,.f>textarea{font-weight:400}
.f select+input{margin-top:6px}
.err{color:var(--red);font-weight:600;margin:0;min-height:0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fld);border:1.5px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:9px;min-height:40px;font-weight:600}
.seg button.on{background:var(--ink);color:var(--surface)}

/* dashboard */
.dash{display:grid;gap:12px;padding-top:8px}
.dbtn{display:grid;grid-template-columns:1fr auto;align-items:center;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:20px 18px;gap:2px}
.dbtn strong{font-family:var(--head);font-size:1.4rem;font-weight:800}
.dbtn span{grid-column:1;color:var(--muted);font-size:.9rem}
.dbtn svg{grid-column:2;grid-row:1/3;width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* tabs */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 12px}
.tab{border:0;border-radius:14px;min-height:58px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-family:var(--head);font-weight:800;font-size:1rem;color:var(--on);white-space:nowrap}
.tab b{background:rgba(255,255,255,.25);border-radius:99px;padding:1px 10px;font-size:.95rem}
.tab svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.5;transition:transform .15s}
.tab[aria-expanded="true"] svg{transform:rotate(180deg)}
.tab.red{background:var(--red)}.tab.green{background:var(--green)}.tab.blue{background:var(--blue);width:100%}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tab b{background:rgba(0,0,0,.2)}}

/* panels & cards */
.panel{border-radius:16px;padding:14px;margin-bottom:14px;display:grid;gap:10px}
.panel.red{background:color-mix(in srgb,var(--red) 9%,var(--surface));border:1.5px solid color-mix(in srgb,var(--red) 40%,var(--line))}
.panel.green{background:color-mix(in srgb,var(--green) 9%,var(--surface));border:1.5px solid color-mix(in srgb,var(--green) 40%,var(--line))}
.grp{display:flex;align-items:center;gap:8px;margin-top:4px}
.grp.red h3{color:var(--red)}
.grp.yl{padding-left:10px;border-left:6px solid var(--yellow)}
.empty{margin:0;color:var(--muted);font-size:.92rem}
.bk{background:var(--surface);border-radius:13px;padding:12px;display:grid;gap:10px;border:1.5px solid var(--line);border-left-width:6px}
.bk.red{border-left-color:var(--red)}.bk.yellow{border-left-color:var(--yellow);background:color-mix(in srgb,var(--yellow) 12%,var(--surface))}.bk.green{border-left-color:var(--green)}
.bk strong{font-size:1.05rem}
.meta{display:flex;flex-wrap:wrap;gap:2px 14px;color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.note{margin:4px 0 0;font-size:.9rem}
.acts{display:flex;gap:8px;justify-content:flex-end}
.chooser{display:flex;align-items:center;gap:10px;background:var(--fld);border-radius:10px;padding:8px 10px;font-size:.9rem;flex-wrap:wrap}
.chooser span{flex:1;min-width:130px}
.chooser .ib{width:38px;height:38px}

/* calculator */
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px;display:grid;gap:14px}
.card>h2{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px 10px;row-gap:6px}
.card>h2>.btn{font-size:.85rem;padding:0 12px;min-height:38px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:400px){.grid2{grid-template-columns:1fr}}
.blk{display:grid;gap:8px}
.row3{display:grid;grid-template-columns:110px 1fr auto;gap:8px}
.ent{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.ent li{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;font-size:.88rem;padding:4px 0;border-bottom:1px dashed var(--line)}
.rm{border:0;background:transparent;color:var(--red);font-size:1.4rem;line-height:1;width:32px;height:32px;border-radius:8px}
.tot{display:flex;justify-content:space-between;font-weight:700}
.hint{margin:0;font-size:.85rem;color:var(--muted)}
.sub-blk{background:var(--fld);border-radius:12px;padding:12px;display:grid;gap:10px;margin-top:-4px}
.warn{background:color-mix(in srgb,var(--red) 12%,var(--surface));border:1.5px solid var(--red);border-radius:10px;padding:10px 12px;font-weight:600;margin:0}
.calcbtn{box-shadow:0 0 0 3px var(--yellow),0 6px 0 rgba(0,0,0,.18)}

/* summary */
.sum{border:2px solid var(--ink)}
.line{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
.line small{color:var(--muted);display:block}
.line.neg b{color:var(--green)}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid var(--ink);padding-top:10px}
.total b{font-family:var(--head);font-size:2rem;font-weight:800;font-variant-numeric:tabular-nums}
.who{display:grid;gap:2px;font-size:.92rem;color:var(--muted)}
.who b{color:var(--ink)}
.pbrk{margin-top:4px;padding-top:10px;border-top:1px dashed var(--line)}
.pbrk h4{font-size:.78rem;color:var(--muted);font-weight:700;margin-bottom:6px}
.pbrk ul{list-style:none;margin:0;padding:0;display:grid;gap:3px}
.pbrk li{display:flex;justify-content:space-between;gap:10px;font-size:.78rem;color:var(--muted)}
.pbrk li b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
#summaryExport{background:var(--surface);padding:22px 18px;border-radius:10px;display:grid;gap:14px}

/* history + remit */
.hist{display:grid;gap:8px;list-style:none;margin:0;padding:0}
.tx{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:8px;background:var(--surface)}
.txh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.chip{border:0;border-radius:99px;padding:3px 12px;font-weight:700;font-size:.82rem;min-height:30px}
.chip.paid{background:var(--green);color:var(--on)}.chip.unpaid{background:var(--red);color:var(--on)}
.chip.nyp{background:var(--yellow);color:var(--yink)}.chip.verified{background:var(--blue);color:var(--on)}.chip.disreg{background:var(--muted);color:var(--on)}
.pd{display:flex;flex-wrap:wrap;gap:2px 12px;color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.pd b{color:var(--ink)}
.tx.disreg-row{opacity:.55}
.dtable{overflow-x:auto;margin-top:12px;border:1px solid var(--line);border-radius:12px}
.dtable table{width:100%;border-collapse:collapse;font-size:.85rem;white-space:nowrap}
.dtable th,.dtable td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line)}
.dtable th{background:var(--surface2,rgba(0,0,0,.03));font-weight:700;position:sticky;top:0}
.dtable tbody tr:last-child td{border-bottom:0}
.dtable tbody tr.disreg-row{opacity:.55}
.dtable td.notes-cell{white-space:normal;max-width:220px;min-width:140px}
.empty-inline{color:var(--muted)}
.bigchk{width:20px;height:20px;cursor:pointer}
.statusfilter{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:4px}
.statusfilter .ck{font-weight:500}
span.chip{display:inline-flex;align-items:center;min-height:0;padding:1px 10px}
.txd{display:grid;gap:4px;font-size:.9rem;border-top:1px dashed var(--line);padding-top:8px}
.link{border:0;background:none;color:var(--blue);font-weight:600;padding:6px 0;text-align:left;min-height:36px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--fld);border-radius:12px;padding:10px}
.stat small{display:block;color:var(--muted);font-size:.78rem}
.stat b{font-family:var(--head);font-size:1.05rem;font-variant-numeric:tabular-nums}
@media (max-width:420px){.stats{grid-template-columns:1fr}}
.stat.wide{grid-column:1/-1}
.stat.hl{background:var(--orange);color:var(--on)}
.stat.hl small{color:rgba(255,255,255,.8)}
.stat .dsub{display:block;color:var(--muted);font-size:.74rem;margin-top:2px}
.stat.hl .dsub{color:rgba(255,255,255,.85)}
.dsHead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.dsHead strong{font-family:var(--head);font-size:1.3rem}
.rr.dim{opacity:.6}
.amts{text-align:right;display:grid;font-variant-numeric:tabular-nums}
.amts small{color:var(--muted)}
.ck{display:flex;align-items:center;gap:8px;font-weight:600;font-size:.9rem}
.ck input{width:22px;height:22px;min-height:0}
.rs{display:grid;gap:8px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.rowr{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;border-bottom:1px dashed var(--line);padding:6px 0}

/* modal + toast */
.ov{position:fixed;inset:0;background:rgba(8,12,18,.55);display:grid;place-items:end center;z-index:20;padding:0}
.md{background:var(--surface);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:12px}
.mbtns{display:flex;gap:8px;justify-content:flex-end}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:99px;font-weight:600;z-index:30;display:none;max-width:90%;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10);
const genToken=()=>{
  if(window.crypto&&crypto.getRandomValues){
    const a=new Uint8Array(16);crypto.getRandomValues(a);
    return Array.from(a,b=>b.toString(16).padStart(2,'0')).join('');
  }
  return uid()+uid()+uid()+uid();
};
const pad=n=>String(n).padStart(2,'0');
const today=()=>{
  const tz=(typeof S!=='undefined'&&S&&S.settings&&S.settings.timezone)||'Asia/Manila';
  try{return new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
  catch(e){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
};
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0};
const peso=n=>'₱'+Number(n||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate=d=>{try{return new Date(d+'T00:00:00').toLocaleDateString('en-PH',{month:'short',day:'numeric',year:'numeric'})}catch(e){return d}};
const fmtTime=t=>{if(!t)return 'No time';const[h,m]=t.split(':');const H=(+h)%12||12;return H+':'+m+((+h)<12?' AM':' PM')};
const cmp=(a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||''));
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const IC={
 bell:'<path d="M6 8a6 6 0 1 1 12 0c0 7 3 7 3 9H3c0-2 3-2 3-9M10 21h4"/>',
 right:'<path d="M5 12h14M13 6l6 6-6 6"/>',left:'<path d="M19 12H5M11 6l-6 6 6 6"/>',
 pen:'<path d="M4 20l4-1 11-11-3-3L5 16l-1 4zM14 6l3 3"/>',
 trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
 calc:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h2M14 12h2M8 16h2M14 16h2"/>',
 check:'<path d="M5 12l5 5 9-10"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',
 chev:'<path d="M6 9l6 6 6-6"/>',
 lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
 unlock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 7.5-2"/>'
};
const ico=(k)=>`<svg viewBox="0 0 24 24" aria-hidden="true">${IC[k]}</svg>`;
const ib=(cls,a,id,label,ic,extra='')=>`<button class="ib ${cls}" data-a="${a}" data-id="${id}" ${extra} aria-label="${label}" title="${label}">${ico(ic)}</button>`;

/* ---------- state ---------- */
const KEY='delivery_dispatch_remit_v1';
/* Shared backend: a Google Apps Script Web App backed by a Google Sheet.
   Set once the Sheet/script is deployed — see setup notes at the bottom of this file. */
const API_URL='https://script.google.com/macros/s/AKfycbyPQAwmIal10aJmz8Fi7UgLcW0rmih-_8IvupT7x40hTPDypA9X2XRkuk37rNI0fgaa0w/exec';
const API_KEY='bj6aF0zueMn6KtDGerbPDoG0alvwuwB3';
const fresh=()=>({settings:{ownerPin:'1903',adminPin:'1234',riders:[],timezone:'Asia/Manila'},bookings:[],transactions:[],ledger:[],riderDays:{},flags:[]});
function normalize(s){
  if(!(s&&s.settings&&s.bookings&&s.transactions))return fresh();
  s.transactions.forEach(t=>{if(!t.status){t.status=t.pay==='paid'?'paid':'nyp';t.mop=t.mop||'online';t.account=t.account||'keem';t.received=t.received!=null?t.received:(t.pay==='paid'?t.r.total:0);t.tip=t.tip||0}if(t.notes==null)t.notes=''});
  s.ledger=s.ledger||[];
  s.riderDays=s.riderDays||{};
  s.flags=s.flags||[];
  (s.settings.riders||[]).forEach(r=>{if(r.cashAdvance==null)r.cashAdvance=0;if(!r.token)r.token=genToken()});
  if(!s.settings.timezone)s.settings.timezone='Asia/Manila';
  return s;
}
function loadLocal(){try{return normalize(JSON.parse(localStorage.getItem(KEY)))}catch(e){return fresh()}}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
/* -- the 3-way-merge baseline (lastSynced) also has to survive a page reload,
   not just live in memory: without it, bootSync() has no way to tell "this
   record is just stale on this device" apart from "this device has a genuine
   unsynced edit", and defaults to treating every local copy as the one in
   progress — which means a device that was ever offline/stale would keep
   ignoring the Owner/Admin's later edits forever, even once back online. -- */
const SYNC_KEY=KEY+'_lastSynced';
function loadSyncedLocal(){try{const v=localStorage.getItem(SYNC_KEY);return v?JSON.parse(v):null}catch(e){return null}}
function saveSyncedLocal(v){try{localStorage.setItem(SYNC_KEY,JSON.stringify(v))}catch(e){}}

let S=loadLocal();
let sVer=0;
/* -- a short, persistent label for THIS browser/device, so a write to the
   shared sheet can say who sent it. This is the direct way to tell "my own
   saves keep succeeding but something else is overwriting them right after"
   apart from "my own saves aren't actually going out" — without this, both
   look identical from a single device's point of view. -- */
const DEVICE_KEY=KEY+'_deviceTag';
function deviceTag(){

/* -- transport: some browsers block a plain cross-origin fetch() to an Apps

   that restriction); writes go out as a hidden HTML form POST, read back
   via postMessage from the response page it loads into a hidden iframe. -- */
let jsonpSeq=0;
function jsonpGet(url){
  return new Promise((resolve,reject)=>{
    const cb='__dcb_'+(jsonpSeq++)+'_'+Date.now();
    const script=document.createElement('script');
    let done=false;
    const timer=setTimeout(()=>{if(done)return;done=true;cleanup();reject(new Error('timeout'))},12000);
    function cleanup(){clearTimeout(timer);try{delete window[cb]}catch(e){window[cb]=undefined}if(script.parentNode)script.parentNode.removeChild(script)}
    window[cb]=(data)=>{if(done)return;done=true;cleanup();resolve(data)};
    script.onerror=()=>{if(done)return;done=true;cleanup();reject(new Error('script_error'))};
    script.src=url+(url.indexOf('?')>=0?'&':'?')+'callback='+cb;
    document.head.appendChild(script);

}
let iframeSeq=0;
function formPost(url,fields){
  return new Promise((resolve,reject)=>{
    const reqId='req_'+(iframeSeq++)+'_'+Date.now();
    const frameName='f_'+reqId;
    const iframe=document.createElement('iframe');
    iframe.name=frameName;iframe.style.display='none';
    document.body.appendChild(iframe);
    const form=document.createElement('form');
    form.method='POST';form.action=url;form.target=frameName;form.style.display='none';
    const all=Object.assign({reqId},fields);
    Object.keys(all).forEach(k=>{const inp=document.createElement('input');inp.type='hidden';inp.name=k;inp.value=all[k];form.appendChild(inp)});
    document.body.appendChild(form);
    let done=false;
    const timer=setTimeout(()=>{if(done)return;done=true;cleanup();reject(new Error('timeout'))},15000);
    function onMsg(ev){
      if(!ev.data||typeof ev.data!=='object'||ev.data.reqId!==reqId)return;
      if(done)return;done=true;cleanup();resolve(ev.data);
    }
    function cleanup(){
      clearTimeout(timer);window.removeEventListener('message',onMsg);
      setTimeout(()=>{if(form.parentNode)form.parentNode.removeChild(form);if(iframe.parentNode)iframe.parentNode.removeChild(iframe)},0);
    }
    window.addEventListener('message',onMsg);
    form.submit();
  });
}

/* -- a text-based (JSON.stringify) equality check is order-sensitive: the
   exact same record with its fields in a different order compares as
   "changed" even though nothing about it actually changed. That happens
   naturally here, because normalize() backfills a missing field (e.g. an
   older transaction saved before "notes" or "tip" existed) by appending it
   as a new trailing key — reordering that record relative to its own
   earlier self. The result: every sync cycle treats such records as
   freshly edited forever, triggering a needless push, which looks to the
   other device like a real conflict, which triggers its own push back —
   an endless, pointless tug-of-war that never lets the save version settle
   even when nothing is actually different. A real recursive compare (keys
   in any order, undefined treated as absent same as JSON does) fixes it. -- */
function deepEq(a,b){
  if(a===b)return true;
  if(a==null||b==null)return a===b;
  if(typeof a!==typeof b)return false;
  if(typeof a!=='object')return a===b;
  if(Array.isArray(a)!==Array.isArray(b))return false;
  if(Array.isArray(a)){
    if(a.length!==b.length)return false;
    for(let i=0;i<a.length;i++)if(!deepEq(a[i],b[i]))return false;
    return true;
  }
  const ak=Object.keys(a).filter(k=>a[k]!==undefined),bk=Object.keys(b).filter(k=>b[k]!==undefined);
  if(ak.length!==bk.length)return false;
  for(const k of ak){if(!Object.prototype.hasOwnProperty.call(b,k)||!deepEq(a[k],b[k]))return false}
  return true;
}
function mergeArrayById(base,local,remote){

  // device that had stale data cached from before baselines were persisted)

  // old" — so for anything both sides already have, trust the shared sheet
  // rather than whatever happens to be sitting in this device's cache.

    }else if(l&&!r){

}

   because the sheet itself is the stale side. Unlike a normal push, this
   does NOT merge with whatever is on the sheet — it takes this device's
   current data as-is and replaces the shared copy with it outright, then
   every other device picks that up on its next sync. Retries a few times
   against the latest version number in case another device pushes mid-way.

   IMPORTANT: this used to run as a completely separate loop from the
   ordinary background sync (the 8-second poll, and the debounced push
   after every edit). Both could end up writing to the server at the same
   time, on the SAME device, each one's write immediately invalidating the
   other's — the save version climbs every time either one "wins" a round,
   but the two counts never settle, because they're actively fighting each
   other rather than racing a different device. Holding the same `pushing`

   quota every few seconds during an actual outage, which only makes it worse
   and delays recovery for every device sharing the same script. -- */
const POLL_BASE_MS=8000;
let pollFails=0,pollBackoffUntil=0;
async function pollOnce(){

  if(!safeToRefresh())return;
  if(Date.now()<pollBackoffUntil)return;
  try{
    const j=await jsonpGet(API_URL+'?key='+encodeURIComponent(API_KEY));
    if(j.ok){
      pollFails=0;pollBackoffUntil=0;
      sync.status='online';sync.msg='';sync.lastOkAt=Date.now();
      if(j.version!==sVer){
        const remote=normalize(j.data);
        const merged=normalize(mergeState(lastSynced,S,remote));
        const changed=!deepEq(merged,S);
        S=merged;sVer=j.version;lastSynced=clone(remote);saveSyncedLocal(lastSynced);saveLocal();
        if(changed)render();
        if(!deepEq(S,remote))schedulePush(); // we're holding local edits the sheet doesn't have yet — send them

        // device is still holding local edits that were never actually sent
        // (e.g. a save attempt failed somewhere without rescheduling itself).
        // Without this, such edits could sit unsent forever with nothing left
        // to ever notice and retry them.
        schedulePush();

  }
}

function compute(c){
  const pabili=c.pabili.reduce((s,e)=>s+e.amt,0);
  const service=c.service?pabili*0.10:0;
  const cashAmt=num(c.cash.amt);
  const cashCharge=c.cash.mode==='pct'?cashAmt*num(c.cash.val)/100:num(c.cash.val);
  const bills=c.bills.reduce((s,e)=>s+e,0);
  const billPct=num(c.billPct);
  const billCharge=bills*billPct/100;
  const r={pabili,service,cashType:c.cash.type,cashAmt,cashCharge:cashAmt>0||cashCharge>0?cashCharge:0,cashMode:c.cash.mode,cashVal:num(c.cash.val),
    bills,billPct,billCharge,fee:num(c.fee),disc:num(c.disc),hop:num(c.hop),wait:num(c.wait),other:num(c.other),otherNote:c.otherNote.trim(),
    pabiliList:c.pabili.slice(),billList:c.bills.slice()};
  r.goods=pabili+bills+(r.cashType==='in'?cashAmt:0);
  r.fees=service+r.cashCharge+billCharge+r.fee+r.hop+r.wait;
  r.total=Math.max(0,r.goods+r.fees-r.disc-r.other);

  gcash:'GCash',bpi:'BPI',bdo:'BDO'};
const ACCOUNT_LABEL={gcash3086:'GCash *3086',gcash4711:'GCash *4711',bpi4571:'BPI *4571',bdo6353:'BDO *6353',keem:'Keem',anthony:'Anthony'};
const acctLabel=a=>ACCOUNT_LABEL[a]||cap(a);
const confirmed=t=>t.status==='paid'||t.status==='verified';
/* Online money (full "online" MOP, or the online half of a "split") already lands in the business's
   own account, so the business can pay the rider their due right away instead of waiting for the
   NYP status to clear — it only has to wait on the cash portion, if any. */
const effectiveConfirmed=t=>t.status!=='disreg'&&(t.mop==='cash'?confirmed(t):true);
const cashHeld=t=>t.mop==='cash'?(t.received||0):t.mop==='split'?(t.splitCash||0):0;
/* Delivery-fee tier: ₱70 to the rider / ₱50 to management for the first ₱120 of delivery fee,
   then ₱8 to the rider / ₱2 to management for every ₱10 beyond that (continuous, not step-wise).
   Below ₱120 (a discounted/custom fee) the same ₱70:₱50 ratio is applied proportionally. */
function dfSplit(df){
  if(df<=0)return{rider:0,mgmt:0};
  if(df<120)return{rider:df*(70/120),mgmt:df*(50/120)};
  const extra=df-120;
  return{rider:70+extra*0.8,mgmt:50+extra*0.2};
}
/* "Other charges" = service charge + store hopping + waiting time + cash in/out charge + bill charge
   (the same total the transaction-history CSV calls OTHER CHARGES) — split 60% rider / 40% management.
   The general "other discount" nets against this other-charges total before its 60/40 split.
   A delivery discount, however, is absorbed entirely by management: the rider's tier share is always
   computed on the full, un-discounted delivery fee, and the discount is subtracted only from
   management's share (so rider+management still equals the net amount actually charged). */
const otherCharges=r=>(r.service||0)+(r.hop||0)+(r.wait||0)+(r.cashCharge||0)+(r.billCharge||0);
const netOther=t=>Math.max(0,otherCharges(t.r)-(t.r.other||0));
const earn=t=>dfSplit(t.r.fee).rider+netOther(t)*0.6+(t.tip||0);
const mgmtEarn=t=>dfSplit(t.r.fee).mgmt-(t.r.disc||0)+netOther(t)*0.4;
/* What the rider is owed in total: their service earning, plus a refund for any pabili/bills
   they fronted out of pocket, minus whatever cash they're already holding from the customer. */
const netOwed=t=>(earn(t)+t.r.pabili+t.r.bills)-cashHeld(t);
const due=t=>effectiveConfirmed(t)&&netOwed(t)<0?-netOwed(t):0;
const refundToRider=t=>effectiveConfirmed(t)&&netOwed(t)>0?netOwed(t):0;
const balanceOf=t=>Math.max(0,t.r.total-(t.received||0));
const excessOf=t=>Math.max(0,(t.received||0)-t.r.total);
const mopLabel=t=>{
  if(t.mop==='cash')return 'Cash';
  if(t.mop==='split')return `Split &ndash; Cash ${peso(t.splitCash||0)} / Online ${peso(t.splitOnline||0)}${t.account?' ('+esc(acctLabel(t.account))+')':''}`;
  const label=MOP_LABEL[t.mop]||esc(cap(t.mop));
  return label+(t.account?' &ndash; '+esc(acctLabel(t.account)):'');
};

/* ---------- daily rider summary ---------- */
const rdKey=(rider,date)=>rider+'__'+date;
const getRiderDay=(rider,date)=>S.riderDays[rdKey(rider,date)]||null;
function shiftDate(d,n){const dt=new Date(d+'T00:00:00');dt.setDate(dt.getDate()+n);return dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate())}
const dayTxns=(rider,date)=>S.transactions.filter(t=>t.rider===rider&&t.date===date&&t.status!=='disreg');
const dayLedger=(rider,date)=>S.ledger.filter(e=>e.rider===rider&&e.date===date);
function daySummary(rider,date){
  const rec=getRiderDay(rider,date);
  const prior=getRiderDay(rider,shiftDate(date,-1));
  const initialBudget=rec?num(rec.initialBudget):(prior&&prior.posted?prior.closingFund:0);
  const txs=dayTxns(rider,date),confirmedTxs=txs.filter(effectiveConfirmed);
  const led=dayLedger(rider,date);
  const totalFund=led.filter(e=>e.type==='fund').reduce((s,e)=>s+e.amount,0);
  const deductions=led.filter(e=>e.type==='deduction').reduce((s,e)=>s+e.amount,0);
  const manualTip=led.filter(e=>e.type==='tip').reduce((s,e)=>s+e.amount,0);
  const riderEarnings=confirmedTxs.reduce((s,t)=>s+earn(t),0)+manualTip;
  const onlineTip=confirmedTxs.filter(t=>t.mop!=='cash').reduce((s,t)=>s+(t.tip||0),0)+manualTip;
  const managementShare=confirmedTxs.reduce((s,t)=>s+mgmtEarn(t),0);
  /* Total dues not paid in cash — counted even while NYP, so an unpaid online order never dents
     the rider's remit. For Split, only the online slice of the due counts here. */
  const onlineDue=t=>t.mop==='cash'?0:t.mop==='split'?Math.max(0,t.r.total-(t.splitCash||0)):t.r.total;
  const onlineRefund=txs.reduce((s,t)=>s+onlineDue(t),0);
  const totalRiderFund=initialBudget+totalFund+deductions+managementShare-onlineRefund-onlineTip;
  return{rec,posted:!!(rec&&rec.posted),ibLocked:!!(rec&&rec.ibLocked),initialBudget,totalFund,deductions,riderEarnings,onlineTip,managementShare,onlineRefund,totalRiderFund};
}

function vSyncNote(){
  if(sync.status==='connecting')return '<p class="hint">Loading the latest shared data&hellip;</p>';
  if(sync.status==='offline')return `<p class="err" role="alert">${esc(sync.msg||'Offline — using the last data saved on this device.')}</p>`;
  return '';
}
const fmtSyncTime=ts=>{try{return new Date(ts).toLocaleTimeString('en-PH',{hour:'numeric',minute:'2-digit'})}catch(e){return ''}};
function vSyncBadge(){
  const map={connecting:['Connecting…','sb-wait'],online:['Synced','sb-ok'],saving:['Saving…','sb-wait'],offline:['Offline','sb-bad'],local:['Local only','sb-bad']};
  const hit=map[sync.status];if(!hit)return'';

  return `<span class="sb ${hit[1]}" title="${esc(sync.msg||'')}">${esc(label)}</span>${API_ON?`<button class="btn ghost sb-refresh" data-a="syncNow" aria-label="Sync now" title="Check the shared sheet right now">&#8635;</button>`:''}`;
}

function vShell(){
  const roleTxt=me.role==='rider'?'Rider: '+me.rider:cap(me.role);
  let body='';
  if(view==='dash')body=vDash();
  else if(view==='bookings')body=me.role==='rider'?vRiderBookings():vBookings();
  else if(view==='remit')body=vRemit();
  else if(view==='paystatus')body=vPaymentStatus();
  else if(view==='report')body=me.role==='owner'?vReport():vDash();
  else if(view==='flags')body=(me.role==='owner'||me.role==='admin')?vFlags():vDash();
  else if(view==='settings')body=vSettings();
  return `<header class="top"><div><strong>Dispatch &amp; Remit</strong><span class="role">${esc(roleTxt)}</span></div>
  <div class="hb">${vSyncBadge()}${view!=='dash'?'<button class="btn ghost" data-a="nav" data-v="dash">Menu</button>':''}<button class="btn ghost" data-a="logout">Log out</button></div></header>${body}`;

function vDash(){
  const arrow='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
  const items=[['bookings',me.role==='rider'?'My bookings':'Bookings','Dispatch, calculate and record deliveries']];
  items.push(['remit',me.role==='rider'?'My remit':'Rider remit','Collections, rider share and CSV export']);
  if(me.role==='owner'||me.role==='admin')items.push(['paystatus','Payment status','All customers — view, update and follow up on payments']);
  if(me.role==='owner')items.push(['report','Earnings report','Management & rider earnings and bookings by date']);
  if(me.role==='owner'||me.role==='admin')items.push(['flags','Flags & Notes','Blocked customers, rider restrictions and reminders']);
  if(me.role==='owner')items.push(['settings','Settings','PINs, riders and rider share']);
  return `<nav class="dash" aria-label="Main menu">${items.map(i=>`<button class="dbtn" data-a="nav" data-v="${i[0]}"><strong>${i[1]}</strong>${arrow}<span>${i[2]}</span></button>`).join('')}</nav>${(me.role==='owner'||me.role==='admin')?vFlagsBanner():''}`;

function vFlagsBanner(){
  const fl=S.flags||[];
  const blocks=fl.filter(f=>f.kind==='block');
  const riderBlocks=fl.filter(f=>f.kind==='riderBlock');
  const itemBans=fl.filter(f=>f.kind==='itemBan');
  const notes=fl.filter(f=>f.kind==='note');
  if(!fl.length)return'';
  const line=(main,sub)=>`<li><strong>${esc(main)}</strong>${sub?` — ${esc(sub)}`:''}</li>`;
  return `<section class="card flagbanner" style="margin-top:14px;border-color:var(--red)">
  <h3 style="color:var(--red)">&#9888; Flags &amp; Notes</h3>
  ${blocks.length?`<p class="hint" style="margin:6px 0 2px">Blocked / account-frozen customers</p><ul class="flaglist">${blocks.map(f=>line(f.customer,f.reason)).join('')}</ul>`:''}
  ${riderBlocks.length?`<p class="hint" style="margin:6px 0 2px">Customers not allowed for specific riders</p><ul class="flaglist">${riderBlocks.map(f=>line(`${f.customer} → not ${f.rider}`,f.reason)).join('')}</ul>`:''}
  ${itemBans.length?`<p class="hint" style="margin:6px 0 2px">Item restrictions</p><ul class="flaglist">${itemBans.map(f=>line(`${f.rider}: ${f.item}`,f.note)).join('')}</ul>`:''}
  ${notes.length?`<p class="hint" style="margin:6px 0 2px">Reminders</p><ul class="flaglist">${notes.map(f=>line(f.rider?`${f.rider}`:'General',f.note)).join('')}</ul>`:''}

}

function txDetail(t){

  if(r.cashAmt)h+=ln('Cash '+r.cashType,peso(r.cashAmt))+ln('Cash charge',peso(r.cashCharge));
  if(r.bills)h+=ln('Bills',peso(r.bills))+ln('Bill charge',peso(r.billCharge));
  h+=ln('Delivery fee',peso(r.fee));if(r.hop)h+=ln('Store hopping',peso(r.hop));if(r.wait)h+=ln('Waiting time',peso(r.wait));
  if(r.disc)h+=ln('Delivery discount','−'+peso(r.disc));if(r.other)h+=ln('Other discount'+(r.otherNote?' ('+esc(r.otherNote)+')':''),'−'+peso(r.other));

}

/* remit */
function remitList(){
  const f=ui.rem,rider=me.role==='rider'?me.rider:f.rider;
  return S.transactions.filter(t=>t.date>=f.from&&t.date<=f.to&&(rider==='all'||t.rider===rider)&&t.status!=='disreg').sort((a,b)=>a.date.localeCompare(b.date)||a.ts-b.ts);
}
function remitTotals(list){
  const paid=list.filter(effectiveConfirmed);
  const collected=paid.reduce((s,t)=>s+(t.received||0),0),earned=paid.reduce((s,t)=>s+earn(t),0);
  const dueAll=paid.reduce((s,t)=>s+due(t),0),done=paid.filter(t=>t.remitted).reduce((s,t)=>s+due(t),0);
  const refund=list.reduce((s,t)=>s+refundToRider(t),0);
  return{collected,earned,dueAll,done,balance:dueAll-done,refund};
}
function ledgerList(riderName){
  const f=ui.rem;
  return S.ledger.filter(e=>e.rider===riderName&&e.date>=f.from&&e.date<=f.to).sort((a,b)=>a.date.localeCompare(b.date)||a.ts-b.ts);
}
function ledgerTotals(riderName){
  const list=ledgerList(riderName);
  const fund=list.filter(e=>e.type==='fund').reduce((s,e)=>s+e.amount,0);
  const ded=list.filter(e=>e.type==='deduction').reduce((s,e)=>s+e.amount,0);
  const tip=list.filter(e=>e.type==='tip').reduce((s,e)=>s+e.amount,0);
  return{fund,ded,tip,list};
}
/* Tip history = manual ledger tips (Add tip) + tips auto-added from an excess
   payment while updating a transaction's payment details — those carry the
   customer's name so the rider can see exactly who the tip came from. */
function tipEntriesCombined(riderName){
  const f=ui.rem;
  const manual=S.ledger.filter(e=>e.rider===riderName&&e.type==='tip'&&e.date>=f.from&&e.date<=f.to)
    .map(e=>({id:e.id,ts:e.ts,date:e.date,amount:e.amount,label:e.note||'Manual tip',kind:'ledger'}));
  const auto=S.transactions.filter(t=>t.rider===riderName&&(t.tip||0)>0&&t.status!=='disreg'&&t.date>=f.from&&t.date<=f.to)
    .map(t=>({id:'tx_'+t.id,ts:t.ts,date:t.date,amount:t.tip,label:'From '+t.customer,kind:'tx'}));
  return[...manual,...auto].sort((a,b)=>a.date.localeCompare(b.date)||a.ts-b.ts);
}

function payList(){
  const f=ui.pay,q=f.q.trim().toLowerCase(),nq=f.notesQ.trim().toLowerCase();
  const anyStatus=Object.values(f.statusSel).some(Boolean);

function dayTipEntries(rider,date){
  const manual=dayLedger(rider,date).filter(e=>e.type==='tip').map(e=>({note:e.note||'Manual tip',amount:e.amount}));
  const auto=dayTxns(rider,date).filter(t=>(t.tip||0)>0).map(t=>({note:'From '+t.customer,amount:t.tip}));
  return[...manual,...auto];
}

   <div style="font-size:.7rem;font-weight:700;color:#D9600A;letter-spacing:.06em">DAILY RIDER SUMMARY</div>
   <h2 style="font-family:'Bricolage Grotesque',sans-serif;margin:2px 0 2px;font-size:1.4rem">${esc(riderName)}</h2>

   ${stat('Initial budget',sum.initialBudget)}
   ${stat('Add fund',sum.totalFund)}
   ${stat('Rider earnings',sum.riderEarnings)}
   ${stat('Online tip',sum.onlineTip)}
   ${stat('Management share',sum.managementShare)}
   ${stat('Total online refund',sum.onlineRefund)}
   ${stat('Deductions added',sum.deductions)}
   <div style="margin-top:6px;padding:12px;background:#D9600A;border-radius:10px;color:#fff">
    <div style="font-size:.7rem;text-transform:uppercase;letter-spacing:.03em;opacity:.9">Total rider fund</div>
    <div style="font-size:1.3rem;font-weight:800">${peso(sum.totalRiderFund)}</div>

   ${ca>0?`<div style="margin-top:8px;padding:9px 0;border-bottom:1px solid #D3DAE3"><div style="font-size:.7rem;color:#586577;text-transform:uppercase;letter-spacing:.03em">Cash advance balance</div><div style="font-size:1.05rem;font-weight:700;color:#D0273A">${peso(ca)}</div></div>`:''}
   ${miniTable('Fund history',fundEntries,'No fund entries for this date.',signedRow)}
   ${miniTable('Deduction history',dedEntries,'No deductions for this date.',signedRow)}
   ${miniTable('Tip history',tipEntries,'No tip entries for this date.',tipRow)}
   <div style="margin-top:12px;font-size:.65rem;color:#9AA7B7">Generated ${new Date().toLocaleString('en-PH',{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'})}</div>`;

/* earnings report */
function vReport(){
  const f=ui.report;
  const inRange=S.transactions.filter(t=>t.date>=f.from&&t.date<=f.to&&t.status!=='disreg');
  const counted=inRange.filter(effectiveConfirmed);
  const mgmtTotal=counted.reduce((s,t)=>s+mgmtEarn(t),0);
  const riderTotal=counted.reduce((s,t)=>s+earn(t),0);
  const grossTotal=counted.reduce((s,t)=>s+t.r.total,0);
  const byRider={};
  inRange.forEach(t=>{
    const k=t.rider;
    if(!byRider[k])byRider[k]={bookings:0,rider:0,mgmt:0};
    byRider[k].bookings++;
    if(effectiveConfirmed(t)){byRider[k].rider+=earn(t);byRider[k].mgmt+=mgmtEarn(t)}
  });
  const riders=Object.keys(byRider).sort((a,b)=>byRider[b].mgmt-byRider[a].mgmt);
  const stat=(label,val,sub)=>`<div class="stat"><small>${label}</small><b>${peso(val)}</b>${sub?`<span class="dsub">${sub}</span>`:''}</div>`;
  return `<section class="card"><h2>Earnings report</h2>
  <p class="hint">Management and rider earnings, and how many bookings came in, for the date range below. Defaults to today.</p>
  <div class="grid2">
   <label class="f">From<input type="date" data-b="ui.report.from" data-rr="1" value="${f.from}"></label>
   <label class="f">To<input type="date" data-b="ui.report.to" data-rr="1" value="${f.to}"></label>
  </div>
  <div class="stats">
   ${stat('Management total earnings',mgmtTotal)}
   ${stat('Rider total earnings',riderTotal)}
   ${stat('Gross amount (all bookings)',grossTotal,'Before splitting into management/rider shares')}
   ${stat('Bookings / transactions',inRange.length,'Disregarded bookings excluded')}
  </div>
  ${riders.length?`<h3 style="margin-top:14px">By rider</h3>
  <div class="dtable"><table><thead><tr><th>Rider</th><th>Bookings</th><th>Rider earnings</th><th>Management earnings</th></tr></thead>
  <tbody>${riders.map(r=>`<tr><td>${esc(r)}</td><td class="num">${byRider[r].bookings}</td><td class="num">${peso(byRider[r].rider)}</td><td class="num">${peso(byRider[r].mgmt)}</td></tr>`).join('')}</tbody>
  <tfoot><tr style="font-weight:700;border-top:2px solid var(--line)"><td>Total</td><td class="num">${inRange.length}</td><td class="num">${peso(riderTotal)}</td><td class="num">${peso(mgmtTotal)}</td></tr></tfoot>
  </table></div>`:'<p class="empty">No bookings in this range.</p>'}
  </section>`;
}

  <section class="card"><h2>Fix a device out of sync</h2>

function vDiag(){
  const d=ui.diag;if(!d)return'';
  if(d.loading)return'<p class="hint">Checking…</p>';
  if(d.error)return`<p class="err" role="alert">${esc(d.error)}</p>`;
  if(!d.remote)return'';
  const row=(label,a,b)=>`<tr><td>${esc(label)}</td><td class="num">${a}</td><td class="num">${b}</td><td class="num">${a===b?'✓ match':'⚠ DIFFERENT'}</td></tr>`;
  const diffBlock=(label,list)=>!list||!list.length?'':`<p class="hint" style="margin-bottom:0"><strong>${esc(label)} (${list.length}):</strong></p><ul style="margin:4px 0 10px;padding-left:18px">${list.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
  const live=d.live;
  const liveLine=live?`<p class="hint">Right now: status <strong>${esc(live.status)}</strong>${live.msg?' — '+esc(live.msg):''}${live.pushing?' · a save is actively in flight':''}${!live.pushing&&live.pushPending?' · a save is queued to go out shortly':''}${!live.pushing&&live.retryPending?' · a failed save is waiting to retry':''}</p>`:'';
  return `<div class="dtable" style="margin-top:10px"><table><thead><tr><th></th><th>This device</th><th>Shared sheet</th><th>&nbsp;</th></tr></thead>
  <tbody>
  ${row('Bookings',d.local.bookings,d.remote.bookings)}
  ${row('Transactions (all)',d.local.transactions,d.remote.transactions)}
  ${row('Transactions (active)',d.local.txActive,d.remote.txActive)}
  </tbody></table></div>
  <p class="hint">Checked ${fmtSyncTime(d.checkedAt)} &middot; this device's save version: ${d.localVersion} &middot; sheet's save version: ${d.remoteVersion}${d.localVersion!==d.remoteVersion?' (different — this device has not picked up the latest save yet)':' (same)'}</p>
  <p class="hint">This device's name: <strong>${esc(DEVICE_TAG)}</strong> &middot; the shared sheet's current data was last saved by: <strong>${esc(d.lastWriter)}</strong>${d.lastWriterIsMe?' (this device)':' (a different device)'}${d.remoteUpdatedAt?' at '+esc(new Date(d.remoteUpdatedAt).toLocaleTimeString()):''}</p>
  ${liveLine}
  ${d.diffs?diffBlock('On this device but not on the shared sheet',d.diffs.localOnly):''}
  ${d.diffs?diffBlock('On the shared sheet but not on this device',d.diffs.remoteOnly):''}`;
}

/* ---------- csv ---------- */
const q=v=>{v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
const m2=n=>(Math.round(n*100)/100).toFixed(2);
function buildCsv(){
  const list=remitList();
  const H=['Date','Customer','Rider','MOP','Cash received','Online received','Account','Status','Pabili','Service charge','Cash in/out type','Cash in/out amount','Cash in/out charge','Bills total','Bill charge','Delivery fee','Store hopping','Waiting time','Delivery discount','Other discount','Discount reason','Total','Amount received','Balance','Tip to rider','Rider earning','Remit due','Refund to rider','Remitted'];
  const rows=list.map(t=>{const r=t.r;const ec=effectiveConfirmed(t);
    const cashRecv=t.mop==='cash'?t.received||0:t.mop==='split'?t.splitCash||0:0;
    const onlineRecv=t.mop==='split'?t.splitOnline||0:t.mop!=='cash'?t.received||0:0;
    return[t.date,t.customer,t.rider,MOP_LABEL[t.mop]||t.mop,m2(cashRecv),m2(onlineRecv),t.mop!=='cash'?cap(t.account||''):'',STATUS_LABEL[t.status],m2(r.pabili),m2(r.service),r.cashAmt?r.cashType:'',m2(r.cashAmt),m2(r.cashCharge),m2(r.bills),m2(r.billCharge),m2(r.fee),m2(r.hop),m2(r.wait),m2(r.disc),m2(r.other),r.otherNote,m2(r.total),m2(t.received||0),m2(balanceOf(t)),m2(t.tip||0),m2(ec?earn(t):0),m2(due(t)),m2(refundToRider(t)),ec?(t.remitted?'Yes':'No'):''].map(q).join(',')});
  const T=remitTotals(list);
  const totalRow=new Array(H.length).fill('');
  totalRow[0]='TOTAL (effectively confirmed only)';totalRow[22]=m2(T.collected);totalRow[25]=m2(T.earned);totalRow[26]=m2(T.dueAll);totalRow[27]=m2(T.refund);
  rows.push(totalRow.map(q).join(','));
  return [H.map(q).join(',')].concat(rows).join('\r\n');
}
async function exportCsv(){
  const text=buildCsv(),f=ui.rem;
  const name='rider-remit_'+f.from+(f.to!==f.from?'_to_'+f.to:'')+'.csv';

  try{dl=window.claude?await window.claude.use('downloads'):null}catch(e){dl=null}

}
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDateCsv(d){try{const dt=new Date(d+'T00:00:00');return pad(dt.getDate())+'-'+MON[dt.getMonth()]+'-'+String(dt.getFullYear()).slice(-2)}catch(e){return d}}
function buildHistoryCsv(){
  const list=S.transactions.slice().sort((a,b)=>a.date.localeCompare(b.date)||a.ts-b.ts);
  const H=['Date','Name','Rider','DF','OTHER CHARGES','MOP','Amount','Received Amount','Account Paid','Status'];
  const rows=list.map(t=>{const r=t.r,other=(r.service||0)+(r.hop||0)+(r.wait||0)+(r.cashCharge||0)+(r.billCharge||0);
    return[fmtDateCsv(t.date),t.customer,t.rider,m2(r.fee),other?m2(other):'',(MOP_LABEL[t.mop]||t.mop).toUpperCase(),m2(r.total),t.received?m2(t.received):'',t.account?acctLabel(t.account).toUpperCase():'',t.status.toUpperCase()].map(q).join(',')});
  return [H.map(q).join(',')].concat(rows).join('\r\n');
}

function buildPayCsv(){
  const list=payList();
  const H=['Date','Customer','Rider','Amount due','Payment received','Balance','Mode of payment','Account received','Notes','Status'];
  const rows=list.map(t=>{const bal=balanceOf(t);
    return[fmtDateCsv(t.date),t.customer,t.rider,m2(t.r.total),m2(t.received||0),m2(bal),t.mop==='split'?'Split':(MOP_LABEL[t.mop]||t.mop),t.mop!=='cash'&&t.account?acctLabel(t.account):'',t.notes||'',STATUS_LABEL[t.status]].map(q).join(',')});

function slug(s){return String(s||'').trim().replace(/[^a-z0-9]+/gi,'-').replace(/^-+|-+$/g,'')||'customer'}
function fallbackSave(blob,name){
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
}
async function downloadSummaryImage(){
  const el=$('#summaryExport');
  if(!el){toast('Calculate a transaction first.');return}
  if(typeof html2canvas==='undefined'){toast('Image export is still loading — try again in a moment.');return}

  catch(e){toast('Could not create the image.');return}
  canvas.toBlob(async blob=>{
    if(!blob){toast('Could not create the image.');return}
    const name='receipt-'+slug(calc.customer)+'-'+calc.date+'.jpg';
    let dl=null;
    try{dl=window.claude?await window.claude.use('downloads'):null}catch(e){dl=null}
    if(!dl){fallbackSave(blob,name);return}

      if(e&&e.code==='declined')return;

/* ---------- actions ---------- */
function setPath(path,val){
  const p=path.split('.');
  let o=p[0]==='c'?calc:p[0]==='m'?ui.modal:p[0]==='fundF'?ui.fundF:p[0]==='dedF'?ui.dedF:p[0]==='tipF'?ui.tipF:p[0]==='pay'?ui.pay:p[0]==='s'?S.settings:p[0]==='ui'?ui:ui.rem;
  for(let i=1;i<p.length-1;i++)o=o[p[i]];
  o[p[p.length-1]]=val;
}
function closeModal(){ui.modal=null}
function delBooking(id){S.bookings=S.bookings.filter(b=>b.id!==id);persist()}

function act(a,el,ev){
  const id=el.dataset.id,v=el.dataset.v,k=el.dataset.k,i=+el.dataset.i;
  switch(a){
  case 'lrole':ui.loginRole=v;ui.err='';break;
  case 'login':{
    const pin=($('#lpin').value||'').trim().replace(/^#/,'');
    const clean=x=>String(x).trim().replace(/^#/,'');
    if(ui.loginRole==='owner'){if(pin&&pin===clean(S.settings.ownerPin)){me={role:'owner'}}}
    else if(ui.loginRole==='admin'){if(pin&&pin===clean(S.settings.adminPin)){me={role:'admin'}}}
    else{const rid=$('#lrider')?$('#lrider').value:'';const r=S.settings.riders.find(x=>x.id===rid);ui.loginRider=rid;if(r&&pin&&pin===clean(r.pin)){me={role:'rider',rider:r.name}}}
    if(me){view='dash';ui.err=''}else ui.err=ui.loginRole==='rider'&&!S.settings.riders.length?'No riders have been added yet.':'That PIN does not match. Check it and try again.';
    break;}
  case 'logout':me=null;view='login';ui.modal=null;calc=newCalc();break;
  case 'nav':view=v;break;
  case 'tog':ui[k]=!ui[k];break;
  case 'mclose':if(el.dataset.ov&&ev&&ev.target!==el)return;closeModal();break;

  /* bookings */
  case 'addBk':ui.modal={type:'bk'};break;
  case 'editBk':ui.modal={type:'bk',id};break;
  case 'saveBk':{
    const cust=$('#mCust').value.trim(),date=$('#mDate').value;
    if(!cust||!date){$('#mErr').textContent='Enter the customer name and date.';return}
    const b=id?S.bookings.find(x=>x.id===id):null;
    if(!b&&date<today()){$('#mErr').textContent='Booking date cannot be before today.';return}
    const data={date,customer:cust,time:$('#mTime').value,fee:num($('#mFee').value),notes:$('#mNotes').value.trim()};
    if(b){if(b.status==='ongoing'){const rd=readRider('mrs','mrm');if(!rd){$('#mErr').textContent='Choose or write the rider.';return}data.rider=rd}Object.assign(b,data)}
    else S.bookings.push(Object.assign({id:uid(),status:'pending',rider:'',alarmed:false},data));
    persist();closeModal();toast(b?'Booking updated':'Booking saved');break;}
  case 'delBk':{const b=S.bookings.find(x=>x.id===id);ui.modal={type:'confirm',title:'Delete this booking?',msg:(b?b.customer:'')+' will be removed.',yes:'delBkYes',id};break;}
  case 'delBkYes':delBooking(id);closeModal();toast('Booking deleted');break;
  case 'alarm':ui.alarm=ui.alarm===id?null:id;break;
  case 'alarmSet':{const b=S.bookings.find(x=>x.id===id);if(b){b.alarmed=v==='1';persist()}ui.alarm=null;break;}
  case 'toOn':ui.modal={type:'assign',id};break;
  case 'doAssign':{const rd=readRider('mrs','mrm');if(!rd){$('#mErr').textContent='Choose or write the rider.';return}
    const b=S.bookings.find(x=>x.id===id);if(b){b.status='ongoing';b.rider=rd;b.alarmed=false;persist()}closeModal();ui.ongo=true;toast('Moved to on-going');break;}
  case 'toPend':{const b=S.bookings.find(x=>x.id===id);if(b){b.status='pending';persist()}ui.pend=true;toast('Moved to pending');break;}
  case 'toCalc':{const b=S.bookings.find(x=>x.id===id);if(!b)return;
    calc=newCalc();calc.date=b.date;calc.customer=b.customer;calc.fee=String(b.fee);calc.bookingId=b.id;
    if(S.settings.riders.some(r=>r.name===b.rider))calc.rider=b.rider;else if(b.rider){calc.rider=b.rider;calc.riderManual=true}
    render();$('#calc').scrollIntoView({behavior:'smooth',block:'start'});toast('Sent to calculator');return;}

  /* calculator */
  case 'riderList':calc.riderManual=false;calc.rider='';break;
  case 'addP':{const amt=num(calc.pAmt),note=calc.pNote.trim();
    if(!(amt>0)){calc.pErr='Enter an amount before adding.';break}
    if(!note){calc.pErr='Add a note for this amount.';break}
    calc.pabili.push({amt,note});calc.pAmt='';calc.pNote='';calc.pErr='';
    setTimeout(()=>{const f=document.querySelector('[data-b="c.pAmt"]');if(f)f.focus()},0);
    break;}
  case 'rmP':calc.pabili.splice(i,1);break;
  case 'svc':calc.service=v==='1';break;
  case 'cashType':calc.cash.type=v;break;
  case 'cashMode':calc.cash.mode=v;break;
  case 'addB':{const amt=num(calc.billAmt);if(!(amt>0)){calc.bErr='Enter a bill amount before adding.';break}calc.bills.push(amt);calc.billAmt='';calc.bErr='';break;}
  case 'rmB':calc.bills.splice(i,1);break;
  case 'exactAmt':setPath(el.dataset.b,el.dataset.v);break;
  case 'calcReset':calc=newCalc();break;
  case 'calculate':{
    calc.msg='';
    if(calc.date<today()){calc.msg='The date cannot be before today.';calc.result=null;break}
    if(!calc.customer.trim()||!calc.rider.trim()){calc.msg='Please check customer name or assigned rider details!';calc.result=null;break}
    if(num(calc.pAmt)>0){calc.msg='Tap Add to include the pabili amount, or clear it.';calc.result=null;break}
    if(num(calc.billAmt)>0){calc.msg='Tap Add to include the bill amount, or clear it.';calc.result=null;break}
    if(num(calc.other)>0&&!calc.otherNote.trim()){calc.msg='Add the reason for the other discount.';calc.result=null;break}
    calc.result=compute(calc);calc.savedId=null;render();const s=$('#summary');if(s)s.scrollIntoView({behavior:'smooth',block:'start'});return;}
  case 'saveTx':{if(!calc.result||calc.savedId)return;
    if(calc.date<today()){calc.msg='The date cannot be before today.';calc.result=null;break}
    const txId=uid();
    S.transactions.push({id:txId,ts:Date.now(),date:calc.date,customer:calc.customer.trim(),rider:calc.rider.trim(),r:calc.result,
      mop:'online',account:'',received:0,splitCash:0,splitOnline:0,status:'nyp',tip:0,remitted:false,notes:''});
    if(calc.bookingId)S.bookings=S.bookings.filter(b=>b.id!==calc.bookingId);
    calc.savedId=txId;
    persist();toast('Saved to history — set payment details from the history list');break;}
  case 'downloadSummary':downloadSummaryImage();return;

  /* history: edit payment */
  case 'editPay':{const t=S.transactions.find(x=>x.id===id);if(!t)return;
    ui.modal={type:'pay',id,mop:t.mop,account:t.account||'',received:String(t.received||0),
      splitCash:String(t.splitCash||0),splitOnline:String(t.splitOnline||0),status:t.status,notes:t.notes||''};break;}
  case 'saveEditPay':{const t=S.transactions.find(x=>x.id===id);if(!t)return;
    const m=ui.modal,recv=receivedOf(m),excess=Math.max(0,recv-t.r.total);
    if(m.mop==='split'&&m.status!=='nyp'&&!m.account){$('#mErr').textContent='Choose which account received the online portion before saving.';return}
    if(m.mop!=='cash'&&m.status==='verified'&&t.status!=='verified'&&me.role!=='owner'){$('#mErr').textContent='Only the Owner can mark an online payment as Verified.';return}
    const status=m.mop==='cash'?'verified':m.status;
    const fields={mop:m.mop,account:(m.mop!=='split'||status==='nyp')?'':m.account,received:recv,splitCash:num(m.splitCash)||0,splitOnline:num(m.splitOnline)||0,status,notes:(m.notes||'').trim()};
    if(excess>0){ui.modal={type:'overpay',excess,yes:'overpayYesEdit',no:'overpayNoEdit',_id:id,_fields:fields,_orig:m};break}
    Object.assign(t,fields,{tip:0});if(fields.status!=='paid'&&fields.status!=='verified')t.remitted=false;persist();closeModal();toast('Payment updated');break;}
  case 'overpayYesEdit':{const m=ui.modal,t=S.transactions.find(x=>x.id===m._id);
    const tip=(m.excess>=1&&m.excess<=300)?m.excess:0;
    if(t){Object.assign(t,m._fields,{tip});if(m._fields.status!=='paid'&&m._fields.status!=='verified')t.remitted=false;persist()}
    closeModal();toast('Payment updated'+(tip>0?' — excess added as rider tip':' — excess added to management collection'));break;}
  case 'overpayNoEdit':{const m=ui.modal,orig=m._orig;orig.err='Please recheck the amount received before saving the payment details.';ui.modal=orig;break;}
  case 'hx':ui.hx[id]=!ui.hx[id];break;
  case 'showAll':ui.showAll=!ui.showAll;break;
  case 'delTx':ui.modal={type:'confirm',title:'Delete this transaction?',msg:'It will also leave the remit totals.',yes:'delTxYes',id};break;
  case 'delTxYes':S.transactions=S.transactions.filter(t=>t.id!==id);persist();closeModal();toast('Transaction deleted');break;
  case 'selTx':if(el.checked)ui.selTx[id]=true;else delete ui.selTx[id];break;
  case 'selAllTx':{const t0=today();const all=S.transactions.filter(t=>t.date===t0).sort((x,y)=>y.ts-x.ts);const list=ui.showAll?all:all.slice(0,10);
    const allSel=list.length>0&&list.every(t=>ui.selTx[t.id]);
    if(allSel)list.forEach(t=>delete ui.selTx[t.id]);else list.forEach(t=>ui.selTx[t.id]=true);break;}
  case 'delSelTx':{const n=Object.keys(ui.selTx).filter(k=>ui.selTx[k]).length;if(!n)return;
    ui.modal={type:'confirm',title:'Delete selected transactions?',msg:'This will permanently delete '+n+' transaction(s) and leave the remit totals.',yes:'delSelTxYes'};break;}
  case 'delSelTxYes':S.transactions=S.transactions.filter(t=>!ui.selTx[t.id]);ui.selTx={};persist();closeModal();toast('Selected transactions deleted');break;

  /* payment status */
  case 'togPayStatus':ui.pay.statusSel[k]=!ui.pay.statusSel[k];break;
  case 'addPayNew':ui.modal={type:'addPay',date:today(),amount:'',customer:'',rider:'',riderManual:false,
    mop:'cash',account:'',received:'0',splitCash:'0',splitOnline:'0',status:'verified',notes:''};break;
  case 'addPayRiderList':ui.modal.riderManual=false;ui.modal.rider='';break;
  case 'saveAddPay':{const m=ui.modal,amount=num(m.amount);
    if(!m.date){$('#mErr').textContent='Pick a date.';return}
    if(!m.customer.trim()){$('#mErr').textContent='Enter the customer name.';return}
    if(!m.rider.trim()){$('#mErr').textContent='Enter or choose the rider.';return}
    if(!(amount>0)){$('#mErr').textContent='Enter the amount due.';return}
    if(m.mop==='split'&&m.status!=='nyp'&&!m.account){$('#mErr').textContent='Choose which account received the online portion before saving.';return}
    if(m.mop!=='cash'&&m.status==='verified'&&me.role!=='owner'){$('#mErr').textContent='Only the Owner can mark an online payment as Verified.';return}
    const recv=receivedOf(m),excess=Math.max(0,recv-amount),status=m.mop==='cash'?'verified':m.status;
    const newTx={id:uid(),ts:Date.now(),date:m.date,customer:m.customer.trim(),rider:m.rider.trim(),
      r:{pabili:0,service:0,cashType:'in',cashAmt:0,cashCharge:0,cashMode:'pct',cashVal:0,bills:0,billPct:0,billCharge:0,
         fee:amount,disc:0,hop:0,wait:0,other:0,otherNote:'',pabiliList:[],billList:[],goods:0,fees:amount,total:amount},
      mop:m.mop,account:(m.mop!=='split'||status==='nyp')?'':m.account,received:recv,
      splitCash:num(m.splitCash)||0,splitOnline:num(m.splitOnline)||0,status,tip:0,remitted:false,notes:(m.notes||'').trim()};
    if(excess>0){ui.modal={type:'overpay',excess,yes:'overpayYesAddPay',no:'overpayNoAddPay',_newTx:newTx,_orig:m};break}
    S.transactions.push(newTx);persist();closeModal();toast('Record added');break;}
  case 'overpayYesAddPay':{const m=ui.modal,tip=(m.excess>=1&&m.excess<=300)?m.excess:0;
    S.transactions.push(Object.assign(m._newTx,{tip}));
    persist();closeModal();toast('Record added'+(tip>0?' — excess added as rider tip':' — excess added to management collection'));break;}
  case 'overpayNoAddPay':{const m=ui.modal,orig=m._orig;orig.err='Please recheck the amount received before saving the payment details.';ui.modal=orig;break;}
  case 'selPay':if(me.role!=='owner')return;if(el.checked)ui.selPay[id]=true;else delete ui.selPay[id];break;
  case 'selAllPay':{if(me.role!=='owner')return;const list=payList();const allSel=list.length>0&&list.every(t=>ui.selPay[t.id]);
    if(allSel)list.forEach(t=>delete ui.selPay[t.id]);else list.forEach(t=>ui.selPay[t.id]=true);break;}
  case 'delSelPay':{if(me.role!=='owner')return;const n=Object.keys(ui.selPay).filter(k=>ui.selPay[k]).length;if(!n)return;
    ui.modal={type:'confirm',title:'Delete selected records?',msg:'This will permanently delete '+n+' customer record(s) and leave the remit totals.',yes:'delSelPayYes'};break;}
  case 'delSelPayYes':if(me.role!=='owner')return;S.transactions=S.transactions.filter(t=>!ui.selPay[t.id]);ui.selPay={};persist();closeModal();toast('Selected records deleted');break;
  case 'downloadPayStatus':downloadPayStatusImage();break;
  case 'downloadRemitImage':downloadRemitSummaryImage(el.dataset.rider);return;
  case 'payCsv':exportPayCsv();return;

  /* remit */
  case 'fundMode':ui.fundF.mode=el.dataset.m;break;
  case 'addFund':{const riderSel=me.role==='rider'?me.rider:ui.rem.rider;
    if(riderSel==='all'){ui.fundF.err='Pick a rider first.';break}
    const mag=Math.abs(num(ui.fundF.amt)),note=ui.fundF.note.trim();
    if(!mag){ui.fundF.err='Enter a non-zero amount.';break}
    if(!note){ui.fundF.err='Add a note for this fund entry.';break}
    const amt=ui.fundF.mode==='sub'?-mag:mag;
    S.ledger.push({id:uid(),ts:Date.now(),type:'fund',rider:riderSel,date:ui.fundF.date,amount:amt,note});
    persist();ui.fundF={date:ui.sumDate,amt:'',note:'',err:'',mode:'add'};toast(amt<0?'Fund subtracted':'Fund added');break;}
  case 'addDed':{const riderSel=me.role==='rider'?me.rider:ui.rem.rider;
    if(riderSel==='all'){ui.dedF.err='Pick a rider first.';break}
    const amt=num(ui.dedF.amt);
    if(!(amt>0)){ui.dedF.err='Enter an amount greater than zero.';break}
    let caApplied=0;
    {const rObj=S.settings.riders.find(r=>r.name===riderSel);
     if(rObj){caApplied=Math.min(amt,rObj.cashAdvance||0);rObj.cashAdvance=Math.max(0,(rObj.cashAdvance||0)-amt)}}
    S.ledger.push({id:uid(),ts:Date.now(),type:'deduction',rider:riderSel,date:ui.dedF.date,amount:amt,note:'',caApplied});
    persist();ui.dedF={date:ui.sumDate,amt:'',err:''};toast('Deduction added');break;}
  case 'addTip':{const riderSel=me.role==='rider'?me.rider:ui.rem.rider;
    if(riderSel==='all'){ui.tipF.err='Pick a rider first.';break}
    const amt=num(ui.tipF.amt),note=ui.tipF.note.trim();
    if(!(amt>0)){ui.tipF.err='Enter an amount greater than zero.';break}
    if(!note){ui.tipF.err='Add a note for this tip.';break}
    S.ledger.push({id:uid(),ts:Date.now(),type:'tip',rider:riderSel,date:ui.tipF.date,amount:amt,note});
    persist();ui.tipF={date:ui.sumDate,amt:'',note:'',err:''};toast('Tip added');break;}
  case 'delLedger':ui.modal={type:'confirm',title:'Delete this entry?',msg:'This removes it from the fund/deduction/tip totals.',yes:'delLedgerYes',id};break;
  case 'delLedgerYes':{const e=S.ledger.find(x=>x.id===id);
    if(e&&e.type==='deduction'&&e.caApplied>0){const rObj=S.settings.riders.find(r=>r.name===e.rider);if(rObj)rObj.cashAdvance=(rObj.cashAdvance||0)+e.caApplied}
    S.ledger=S.ledger.filter(x=>x.id!==id);persist();closeModal();toast('Entry deleted'+(e&&e.type==='deduction'&&e.caApplied>0?' — cash advance balance restored':''));break;}
  case 'saveInitBudget':{const rider=el.dataset.rider,date=ui.sumDate,key=rdKey(rider,date);
    const rec=S.riderDays[key]||{};
    if(rec.ibLocked&&me.role!=='owner'){toast('This amount is locked by the Owner');return}
    const amt=num(ui.ibF!=null?ui.ibF:0);
    S.riderDays[key]={...rec,initialBudget:amt,posted:!!rec.posted};
    ui.ibF=null;persist();toast('Initial budget saved');break;}
  case 'toggleIbLock':{const rider=el.dataset.rider,date=el.dataset.date,key=rdKey(rider,date);
    const rec=S.riderDays[key]||{};
    S.riderDays[key]={...rec,ibLocked:!rec.ibLocked};
    persist();toast(S.riderDays[key].ibLocked?'Initial budget locked — Admin cannot edit it':'Initial budget unlocked');break;}
  case 'saveCashAdvance':{const rider=el.dataset.rider;
    const rObj=S.settings.riders.find(r=>r.name===rider);
    if(rObj){rObj.cashAdvance=Math.max(0,num(ui.caF!=null?ui.caF:0))}
    ui.caF=null;persist();toast('Cash advance balance saved');break;}
  case 'postDay':{const rider=el.dataset.rider,date=ui.sumDate,key=rdKey(rider,date);
    const sum=daySummary(rider,date);
    S.riderDays[key]={...(S.riderDays[key]||{}),initialBudget:sum.initialBudget,posted:true,closingFund:sum.totalRiderFund};
    dayTxns(rider,date).filter(effectiveConfirmed).forEach(t=>{t.remitted=true});
    const nextKey=rdKey(rider,shiftDate(date,1));
    if(!S.riderDays[nextKey])S.riderDays[nextKey]={initialBudget:sum.totalRiderFund,posted:false};
    ui.sumDate=shiftDate(date,1);ui.ibF=null;
    ui.fundF.date=ui.sumDate;ui.dedF.date=ui.sumDate;ui.tipF.date=ui.sumDate;
    persist();toast('Day posted — remit marked as settled, next day started');break;}
  case 'syncNow':manualSync();return;
  case 'checkLive':if(me.role!=='owner')return;checkLiveData();return;
  case 'forceSyncAsk':if(me.role!=='owner')return;ui.modal={type:'forceSync'};break;
  case 'doForceSync':if(me.role!=='owner')return;closeModal();forcePushLocal();return;
  case 'csv':exportCsv();return;
  case 'historyCsv':exportHistoryCsv();return;

  /* flags & notes */
  case 'addBlock':{const f=ui.flagF.block,customer=f.customer.trim();
    if(!customer){toast('Enter a customer name');return}
    S.flags.push({id:uid(),ts:Date.now(),kind:'block',customer,reason:f.reason.trim()});
    persist();ui.flagF.block={customer:'',reason:''};toast('Blocked customer added');break;}
  case 'addRiderBlock':{const f=ui.flagF.riderBlock,customer=f.customer.trim();
    if(!customer||!f.rider){toast('Enter a customer name and pick a rider');return}
    S.flags.push({id:uid(),ts:Date.now(),kind:'riderBlock',customer,rider:f.rider,reason:f.reason.trim()});
    persist();ui.flagF.riderBlock={customer:'',rider:'',reason:''};toast('Restriction added');break;}
  case 'addItemBan':{const f=ui.flagF.itemBan,item=f.item.trim();
    if(!f.rider||!item){toast('Pick a rider and enter an item');return}
    S.flags.push({id:uid(),ts:Date.now(),kind:'itemBan',rider:f.rider,item,note:f.note.trim()});
    persist();ui.flagF.itemBan={rider:'',item:'',note:''};toast('Item restriction added');break;}
  case 'addNote':{const f=ui.flagF.note,note=f.note.trim();
    if(!note){toast('Enter a reminder');return}
    S.flags.push({id:uid(),ts:Date.now(),kind:'note',rider:f.rider,note});
    persist();ui.flagF.note={rider:'',note:''};toast('Reminder added');break;}
  case 'delFlag':S.flags=S.flags.filter(f=>f.id!==id);persist();toast('Entry deleted');break;
  case 'editFlag':{const f=S.flags.find(x=>x.id===id);if(!f)return;
    ui.modal={type:'flag',id:f.id,kind:f.kind,customer:f.customer||'',rider:f.rider||'',item:f.item||'',reason:f.reason||'',note:f.note||''};break;}
  case 'saveFlag':{const m=ui.modal,f=S.flags.find(x=>x.id===m.id);if(!f)return;
    if(m.kind==='block'){const customer=(m.customer||'').trim();if(!customer){$('#mErr').textContent='Enter a customer name.';return}
      f.customer=customer;f.reason=(m.reason||'').trim();}
    else if(m.kind==='riderBlock'){const customer=(m.customer||'').trim();if(!customer||!m.rider){$('#mErr').textContent='Enter a customer name and pick a rider.';return}
      f.customer=customer;f.rider=m.rider;f.reason=(m.reason||'').trim();}
    else if(m.kind==='itemBan'){const item=(m.item||'').trim();if(!m.rider||!item){$('#mErr').textContent='Pick a rider and enter an item.';return}
      f.rider=m.rider;f.item=item;f.note=(m.note||'').trim();}
    else if(m.kind==='note'){const note=(m.note||'').trim();if(!note){$('#mErr').textContent='Enter a reminder.';return}
      f.rider=m.rider||'';f.note=note;}
    persist();closeModal();toast('Entry updated');break;}

  /* settings */
  case 'savePins':{const o=$('#sOwner').value.trim(),ad=$('#sAdmin').value.trim();
    if(o.replace('#','').length<4||ad.replace('#','').length<4){toast('PINs need at least 4 characters');return}
    S.settings.ownerPin=o;S.settings.adminPin=ad;persist();toast('PINs saved');return;}
  case 'addRider':{const n=$('#rName').value.trim(),p=$('#rPin').value.trim();
    if(!n||p.length<4){$('#sErr').textContent='Enter a name and a PIN of at least 4 digits.';return}
    if(S.settings.riders.some(r=>r.name.toLowerCase()===n.toLowerCase())){$('#sErr').textContent='That rider name already exists.';return}
    S.settings.riders.push({id:uid(),name:n,pin:p,cashAdvance:0,token:genToken()});persist();toast('Rider added');break;}
  case 'editRider':ui.modal={type:'rider',id};break;
  case 'saveRiderPin':{const p=$('#npin').value.trim();if(p.length<4){$('#mErr').textContent='Use at least 4 digits.';return}
    const r=S.settings.riders.find(x=>x.id===id);if(r){r.pin=p;persist()}closeModal();toast('PIN updated');break;}
  case 'delRider':S.settings.riders=S.settings.riders.filter(r=>r.id!==id);persist();toast('Rider removed');break;
  case 'riderLink':{const r=S.settings.riders.find(x=>x.id===id);if(!r)return;
    const url=location.origin+location.pathname+'?rt='+r.token;
    ui.modal={type:'riderLink',riderId:r.id,name:r.name,url};break;}
  case 'rotateRiderLink':{const r=S.settings.riders.find(x=>x.id===id);if(!r)return;
    r.token=genToken();persist();
    const url=location.origin+location.pathname+'?rt='+r.token;
    ui.modal={type:'riderLink',riderId:r.id,name:r.name,url};toast('Link rotated — the old link no longer works');break;}
  }
  render();
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  act(el.dataset.a,el,e);
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.b&&el.tagName!=='SELECT'&&!el.dataset.rr)setPath(el.dataset.b,el.value);
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const el=e.target;
  if(!el.dataset||!el.dataset.enter)return;
  e.preventDefault();
  if(el.dataset.b)setPath(el.dataset.b,el.value);
  el.blur();
  act(el.dataset.enter,el,e);
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(!document.body.contains(el))return;
  if(el.id==='mrs'){const m=$('#mrm');if(m)m.style.display=el.value==='__m'?'':'none';return}
  if(!el.dataset||!el.dataset.b)return;
  if(el.dataset.b==='c.rider'&&el.value==='__m'){calc.riderManual=true;calc.rider='';render();return}
  if(el.dataset.b==='m.rider'&&el.value==='__m'&&ui.modal&&ui.modal.type==='addPay'){ui.modal.riderManual=true;ui.modal.rider='';render();return}
  setPath(el.dataset.b,el.value);
  // Keep the Add fund / Deduction / Tip date fields following whichever day the
  // Daily rider summary is currently showing, so a new entry lands on the day
  // being viewed by default instead of silently defaulting to today's date.
  if(el.dataset.b==='ui.sumDate'){ui.fundF.date=ui.sumDate;ui.dedF.date=ui.sumDate;ui.tipF.date=ui.sumDate}
  if(/\.mop$/.test(el.dataset.b)){
    const base=el.dataset.b.slice(0,-4);
    if(el.value==='cash')setPath(base+'.status','verified');
    else if(me.role!=='owner'){
      const obj=base==='c'?calc:base==='m'?ui.modal:null;
      if(obj&&obj.status==='verified')setPath(base+'.status','nyp');
    }
  }
  if(el.dataset.b==='s.timezone'){persist();toast('Time zone updated')}
  if(el.tagName==='SELECT'||el.dataset.rr)render();
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='lpin')act('login',e.target)});
render();
bootSync();
</script>
</body>
</html>
